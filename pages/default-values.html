<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Default Values</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="content-page">

    <h1>CSS Default Values</h1>

    <p>
        Many CSS properties have default values that are used when
        no value is specified by the author.
    </p>

    <table>
        <tr>
            <th>Property</th>
            <th>Default Value</th>
        </tr>

        <tr>
            <td>color</td>
            <td>Depends on browser</td>
        </tr>

        <tr>
            <td>font-size</td>
            <td>Medium</td>
        </tr>

        <tr>
            <td>font-weight</td>
            <td>normal</td>
        </tr>

        <tr>
            <td>display</td>
            <td>Depends on element</td>
        </tr>

        <tr>
            <td>position</td>
            <td>static</td>
        </tr>

        <tr>
            <td>visibility</td>
            <td>visible</td>
        </tr>
    </table>

</body>
</html>
